<style>
  :root{
    --paper:#f7f1e6;
    --paper-2:#efe4d0;
    --card:#fffdf8;
    --ink:#2a221a;
    --ink-soft:#7a6c5a;
    --border:#e2d5bd;
    --accent:#c1502c;
    --accent-ink:#fff8f0;

    --c-food:#FF5A4F;
    --c-cafe:#FFB21A;
    --c-nature:#7CB342;
    --c-city:#3478D4;
    --c-stay:#8A4DE8;

    --radius:16px;
    --radius-sm:10px;
    --shadow:0 8px 24px rgba(42,34,26,.14);
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Montserrat',sans-serif;
    overflow:hidden;
  }
  h1,h2,h3,.serif{font-family:'Montserrat',sans-serif;font-weight:700;}
  .mono{font-family:'Montserrat',sans-serif;font-weight:600;letter-spacing:.06em;}

  #app{
    position:fixed;
    inset:0;
    display:flex;
    flex-direction:column;
  }

  /* ---------- Top bar: floating island over the map ---------- */
  #topbar{
    position:absolute;
    top:calc(10px + env(safe-area-inset-top));
    left:12px;
    width:min(320px, calc(100% - 24px));
    z-index:20;
    display:flex;
    flex-direction:column;
    gap:8px;
    pointer-events:none;
  }
  #topbar > *{pointer-events:auto;}
  #topbar-controls{display:flex;flex-direction:column;gap:8px;}

  #search{
    width:100%;
    padding:9px 14px;
    border-radius:999px;
    border:1px solid rgba(226,213,189,.7);
    background:rgba(255,253,248,.82);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    box-shadow:var(--shadow);
    font-family:'Montserrat',sans-serif;
    font-size:13.5px;
    color:var(--ink);
    outline:none;
  }
  #search::placeholder{color:var(--ink-soft);}

  #chips{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
  }
  .chip{
    flex:0 0 auto;
    padding:6px 12px;
    border-radius:999px;
    border:1px solid rgba(226,213,189,.7);
    background:rgba(255,253,248,.82);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    box-shadow:var(--shadow);
    font-size:12.5px;
    font-weight:500;
    color:var(--ink-soft);
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:6px;
    user-select:none;
    white-space:nowrap;
  }
  .chip .dot{width:8px;height:8px;border-radius:50%;background:currentColor;}
  .chip[data-active="true"]{
    background:var(--ink);
    border-color:var(--ink);
    color:var(--paper);
  }
  .chip[data-cat="food"]{color:var(--c-food);}
  .chip[data-cat="cafe"]{color:var(--c-cafe);}
  .chip[data-cat="nature"]{color:var(--c-nature);}
  .chip[data-cat="city"]{color:var(--c-city);}
  .chip[data-cat="stay"]{color:var(--c-stay);}
  .chip[data-cat="food"][data-active="true"]{background:var(--c-food);border-color:var(--c-food);color:var(--accent-ink);}
  .chip[data-cat="cafe"][data-active="true"]{background:var(--c-cafe);border-color:var(--c-cafe);color:var(--accent-ink);}
  .chip[data-cat="nature"][data-active="true"]{background:var(--c-nature);border-color:var(--c-nature);color:var(--accent-ink);}
  .chip[data-cat="city"][data-active="true"]{background:var(--c-city);border-color:var(--c-city);color:var(--accent-ink);}
  .chip[data-cat="stay"][data-active="true"]{background:var(--c-stay);border-color:var(--c-stay);color:var(--accent-ink);}

  /* ---------- Main area ---------- */
  #main{
    position:relative;
    flex:1;
    min-height:0;
    display:flex;
  }
  #map{
    flex:1;
    height:100%;
    background:var(--paper-2);
  }
  .pin{
    width:28px;height:28px;
    border-radius:50%;
    border:2.5px solid var(--card);
    box-shadow:0 2px 6px rgba(0,0,0,.3);
    display:flex;align-items:center;justify-content:center;
  }
  .pin svg{width:17px;height:17px;}
  .pin.food{background:var(--c-food);}
  .pin.cafe{background:var(--c-cafe);}
  .pin.nature{background:var(--c-nature);}
  .pin.city{background:var(--c-city);}
  .pin.stay{background:var(--c-stay);}

  .popup-card{
    font-family:'Montserrat',sans-serif;width:220px;
    background:var(--card);border-radius:var(--radius-sm);box-shadow:var(--shadow);
    overflow:hidden;
  }
  .popup-card img{width:100%;height:110px;object-fit:cover;border-radius:8px 8px 0 0;margin:-1px -1px 8px;display:block;width:calc(100% + 2px);}
  .popup-card .body{padding:10px 12px 12px;}
  .popup-card h3{margin:0 0 2px;font-size:16px;}
  .popup-card .meta{font-size:11px;color:var(--ink-soft);margin-bottom:6px;font-family:'Montserrat',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.05em;}
  .popup-card .teaser{font-size:13px;line-height:1.4;margin:0;}

  /* ---------- List panel ---------- */
  #panel{
    background:var(--paper);
    display:flex;
    flex-direction:column;
    z-index:15;
  }
  #panel-handle{
    display:none;
    flex:0 0 auto;
    padding:8px 0 4px;
    justify-content:center;
    cursor:grab;
  }
  #panel-handle .bar{width:36px;height:4px;border-radius:2px;background:var(--border);}
  #list{
    flex:1;
    overflow-y:auto;
    padding:10px 14px calc(24px + env(safe-area-inset-bottom));
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  #list .empty{color:var(--ink-soft);font-size:14px;text-align:center;padding:30px 10px;}

  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:12px 14px;
    cursor:pointer;
    transition:border-color .15s ease;
  }
  .card[data-active="true"]{border-color:var(--ink);}
  .card .thumb{width:100%;height:120px;object-fit:cover;border-radius:10px;margin-bottom:10px;display:block;}
  .card .row1{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
  .card h3{margin:0;font-size:16px;font-weight:600;}
  .card .loc{font-size:12px;color:var(--ink-soft);margin:2px 0 6px;font-family:'Montserrat',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.05em;}
  .card .teaser{font-size:13.5px;line-height:1.45;margin:0;color:var(--ink);}
  .card[data-active="true"] .teaser{display:none;}
  .card .desc{font-size:13.5px;line-height:1.55;margin:0;color:var(--ink);display:none;}
  .card[data-active="true"] .desc{display:block;}
  .card .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .card .tags span{
    font-size:11px;
    padding:3px 8px;
    border-radius:999px;
    background:var(--paper-2);
    color:var(--ink-soft);
    font-family:'Montserrat',sans-serif;
  }
  .cat-tag{
    display:inline-flex;align-items:center;gap:4px;
    font-size:11px;font-weight:500;
    padding:2px 0;
  }
  .cat-tag .dot{width:7px;height:7px;border-radius:50%;}
  .cat-tag.food{color:var(--c-food);}
  .cat-tag.cafe{color:var(--c-cafe);}
  .cat-tag.nature{color:var(--c-nature);}
  .cat-tag.city{color:var(--c-city);}
  .cat-tag.stay{color:var(--c-stay);}
  .cat-tag .dot.food{background:var(--c-food);}
  .cat-tag .dot.cafe{background:var(--c-cafe);}
  .cat-tag .dot.nature{background:var(--c-nature);}
  .cat-tag .dot.city{background:var(--c-city);}
  .cat-tag .dot.stay{background:var(--c-stay);}

  /* ---------- Mobile: bottom sheet ---------- */
  @media (max-width:899px){
    #main{display:block;}
    #map{position:absolute;inset:0;}
    #panel{
      position:absolute;
      left:0;right:0;bottom:0;
      height:78%;
      border-radius:20px 20px 0 0;
      box-shadow:0 -8px 24px rgba(42,34,26,.18);
      transform:translateY(calc(100% - 128px));
      transition:transform .28s cubic-bezier(.32,.72,0,1);
      touch-action:none;
    }
    #panel[data-expanded="true"]{transform:translateY(0);}
    #panel-handle{display:flex;}
  }

  /* ---------- Desktop: sidebar ---------- */
  @media (min-width:900px){
    #panel{
      width:290px;
      flex:0 0 auto;
      border-right:1px solid var(--border);
      order:-1;
    }
    #topbar{left:calc(290px + 12px);}
  }

  /* Обесцвечиваем тайлы Яндекса и красим полупрозрачным синим оверлеем —
     надёжнее даёт ровный синий тон, чем hue-rotate (тот скатывался в бирюзу).
     Таргетируем только слой тайлов (ground-pane), не метки/попапы. */
  #map [class*="ground-pane"]{
    filter:grayscale(1) brightness(1.12);
  }
  /* inner-panes — единственный контейнер тайлов/меток с реальными размерами
     (у ground-pane они 0x0, тайлы внутри него позиционируются абсолютно);
     оверлей вставляем сюда через ::after с z-index между ground-pane (501)
     и places-pane (2004), чтобы красить только карту, а не метки. */
  #map [class*="inner-panes"]::after{
    content:"";
    position:absolute;
    inset:0;
    z-index:1000;
    background:rgba(52,120,212,.34);
    mix-blend-mode:multiply;
    pointer-events:none;
  }

  .cluster-dot{
    width:38px;height:38px;border-radius:50%;
    background:var(--ink);color:var(--paper);
    display:flex;align-items:center;justify-content:center;
    font-family:'Montserrat',sans-serif;font-size:13px;font-weight:500;
    border:3px solid var(--card);box-shadow:0 2px 8px rgba(42,34,26,.3);
  }
</style>

</div>

  };

  /* ===================== TELEGRAM THEME ===================== */
  (function initTelegram(){
    try{
      const tg = window.Telegram && window.Telegram.WebApp;
      if(!tg) return;
      tg.ready();
      tg.expand();
      const p = tg.themeParams || {};
      const root = document.documentElement.style;
      if(p.bg_color)          root.setProperty('--paper', p.bg_color);
      if(p.secondary_bg_color) root.setProperty('--paper-2', p.secondary_bg_color);
      if(p.text_color)        root.setProperty('--ink', p.text_color);
      if(p.hint_color)        root.setProperty('--ink-soft', p.hint_color);
      if(p.button_color)      root.setProperty('--accent', p.button_color);
      if(p.section_bg_color)  root.setProperty('--card', p.section_bg_color);
    }catch(e){ /* не в Telegram — используем дефолтную палитру */ }
  })();

  ymaps.ready(function(){

  /* ===================== STATE ===================== */
  let activeCat = null;
  let activeId = null;
  let query = "";

  /* ===================== MAP ===================== */
  const map = new ymaps.Map('map', {
    center:[55.76, 37.64],
    zoom:5,
    controls:[],
  }, {
    suppressMapOpenBlock:true,
  });
  map.container.fitToViewport();
  map.controls.add('zoomControl', { position:{ right:10, bottom:10 } });

  const clusterer = new ymaps.Clusterer({
    clusterIconLayout: ymaps.templateLayoutFactory.createClass(
      '<div class="cluster-dot">{{ properties.geoObjects.length }}</div>'
    ),
    clusterIconShape: { type:'Rectangle', coordinates:[[-19,-19],[19,19]] },
    groupByCoordinates:false,
    clusterDisableClickZoom:false,
    clusterHideIconOnBalloonOpen:false,
  });
  map.geoObjects.add(clusterer);

  const markers = {};
  const placemarks = LOCATIONS.map(loc => {
    const IconLayout = ymaps.templateLayoutFactory.createClass(
      `<div class="pin ${loc.cat}">${CAT_META[loc.cat].svg}</div>`
    );
    const placemark = new ymaps.Placemark([loc.lat, loc.lng], {
      balloonContent: popupHtml(loc),
      hintContent: loc.name,
    }, {
      iconLayout: IconLayout,
      iconShape: { type:'Rectangle', coordinates:[[-22,-22],[22,22]] },
      hideIconOnBalloonOpen:false,
      balloonPanelMaxMapArea:0,
    });
    placemark.events.add('click', () => selectLocation(loc.id, { fromMap:true }));
    markers[loc.id] = placemark;
    return placemark;
  });
  clusterer.add(placemarks);

  function popupHtml(loc){
    const img = loc.photo ? `<img src="images/${loc.photo}" alt="" loading="lazy">` : "";
    const teaser = (loc.teaser && loc.teaser !== loc.name) ? `<p class="teaser">${escapeHtml(loc.teaser)}</p>` : "";
    return `<div class="popup-card">
      ${img}
      <div class="body">
        <div class="meta">${loc.city} · ${CAT_META[loc.cat].label}</div>
        <h3>${escapeHtml(loc.name)}</h3>
        ${teaser}
      </div>
    </div>`;
  }

  /* ===================== CHIPS ===================== */
  const chipsEl = document.getElementById('chips');
  const allChip = makeChip(null, "Все", null);
  chipsEl.appendChild(allChip);
  Object.keys(CAT_META).forEach(cat => {
    chipsEl.appendChild(makeChip(cat, CAT_META[cat].label, cat));
  });
  setChipActive(null);

  function makeChip(cat, label, colorKey){
    const el = document.createElement('div');
    el.className = 'chip';
    if(cat) el.dataset.cat = cat;
    el.innerHTML = cat ? `<span class="dot"></span>${label}` : label;
    el.addEventListener('click', () => {
      activeCat = cat;
      setChipActive(cat);
      render();
    });
    return el;
  }
  function setChipActive(cat){
    [...chipsEl.children].forEach((el,i) => {
      const isAll = i===0;
      el.dataset.active = isAll ? (cat===null) : (el.dataset.cat === cat);
    });
  }

  /* ===================== SEARCH ===================== */
  document.getElementById('search').addEventListener('input', e => {
    query = e.target.value.trim().toLowerCase();
    render();
  });

  /* ===================== LIST ===================== */
  const listEl = document.getElementById('list');

  function filteredLocations(){
    return LOCATIONS.filter(loc => {
      if(activeCat && loc.cat !== activeCat) return false;
      if(query){
        const hay = `${loc.name} ${loc.city} ${loc.tags.join(' ')}`.toLowerCase();
        if(!hay.includes(query)) return false;
      }
      return true;
    });
  }

  function render(){
    const items = filteredLocations();
    listEl.innerHTML = "";
    if(items.length === 0){
      listEl.innerHTML = `<div class="empty">Ничего не найдено</div>`;
      return;
    }
    items.forEach(loc => listEl.appendChild(renderCard(loc)));
  }

  function renderCard(loc){
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.id = loc.id;
    card.dataset.active = (loc.id === activeId);
    const img = loc.photo ? `<img class="thumb" src="images/${loc.photo}" alt="" loading="lazy">` : "";
    const hasText = loc.teaser && loc.teaser !== loc.name;
    const teaser = hasText ? `<p class="teaser">${escapeHtml(loc.teaser)}</p>` : "";
    const desc = hasText ? `<p class="desc">${escapeHtml(loc.desc)}</p>` : "";
    card.innerHTML = `
      ${img}
      <div class="cat-tag ${loc.cat}"><span class="dot ${loc.cat}"></span>${CAT_META[loc.cat].label}</div>
      <div class="row1">
        <h3>${escapeHtml(loc.name)}</h3>
      </div>
      <div class="loc">${escapeHtml(loc.city)}</div>
      ${teaser}
      ${desc}
      <div class="tags">${loc.tags.map(t=>`<span>#${escapeHtml(t)}</span>`).join('')}</div>
    `;
    card.addEventListener('click', () => selectLocation(loc.id, { fromMap:false }));
    return card;
  }

  function selectLocation(id, { fromMap }){
    activeId = (activeId === id && !fromMap) ? null : id;
    const loc = LOCATIONS.find(l => l.id === id);
    [...listEl.children].forEach(c => {
      if(c.dataset.id) c.dataset.active = (Number(c.dataset.id) === activeId);
    });
    if(loc){
      map.setCenter([loc.lat, loc.lng], Math.max(map.getZoom(), 16), { duration:400 }).then(() => {
        markers[id].balloon.open();
      });
      if(!fromMap){
        const cardEl = listEl.querySelector(`[data-id="${id}"]`);
        if(cardEl) cardEl.scrollIntoView({ behavior:'smooth', block:'nearest' });
        expandPanel(true);
      }
    }
  }

  /* ===================== MOBILE BOTTOM SHEET ===================== */
  const panel = document.getElementById('panel');
  const panelHandle = document.getElementById('panel-handle');

  function expandPanel(v){ panel.dataset.expanded = v ? "true" : "false"; }

  panelHandle.addEventListener('click', () => {
    expandPanel(panel.dataset.expanded !== "true");
  });

  let dragStartY = null, dragStartExpanded = false;
  panelHandle.addEventListener('touchstart', e => {
    dragStartY = e.touches[0].clientY;
    dragStartExpanded = panel.dataset.expanded === "true";
  }, { passive:true });
  panelHandle.addEventListener('touchmove', e => {
    if(dragStartY === null) return;
    const dy = e.touches[0].clientY - dragStartY;
    if(dy < -40) expandPanel(true);
    if(dy > 40) expandPanel(false);
  }, { passive:true });
  panelHandle.addEventListener('touchend', () => { dragStartY = null; });

  map.events.add('actionbegin', () => expandPanel(false));

  /* ===================== UTIL ===================== */
  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, c => ({
      '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
    }[c]));
  }

  render();

  /* Вписать в видимую область "плотное ядро" точек при первой загрузке.
     Географические выбросы (единичные места за тысячи км от основного кластера)
     не должны определять начальный зум — они всё равно на карте, просто дальше. */
  function haversineKm(lat1, lng1, lat2, lng2){
    const R = 6371, toRad = d => d * Math.PI / 180;
    const dLat = toRad(lat2 - lat1), dLng = toRad(lng2 - lng1);
    const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng/2)**2;
    return 2 * R * Math.asin(Math.sqrt(a));
  }
  function quantile(sorted, q){
    const pos = (sorted.length - 1) * q, base = Math.floor(pos), rest = pos - base;
    return sorted[base + 1] !== undefined ? sorted[base] + rest * (sorted[base+1] - sorted[base]) : sorted[base];
  }

  const sortedLats = LOCATIONS.map(l => l.lat).sort((a,b) => a-b);
  const sortedLngs = LOCATIONS.map(l => l.lng).sort((a,b) => a-b);
  const medianLat = quantile(sortedLats, 0.5);
  const medianLng = quantile(sortedLngs, 0.5);
  const distances = LOCATIONS.map(l => haversineKm(medianLat, medianLng, l.lat, l.lng)).sort((a,b) => a-b);
  const q1 = quantile(distances, 0.25), q3 = quantile(distances, 0.75);
  const cutoffKm = q3 + 1.5 * (q3 - q1);
  const coreLocations = LOCATIONS.filter(l => haversineKm(medianLat, medianLng, l.lat, l.lng) <= cutoffKm);

  const boundsSource = coreLocations.length ? coreLocations : LOCATIONS;
  const boundsLats = boundsSource.map(l => l.lat);
  const boundsLngs = boundsSource.map(l => l.lng);
  const bounds = [
    [Math.min(...boundsLats), Math.min(...boundsLngs)],
    [Math.max(...boundsLats), Math.max(...boundsLngs)],
  ];
  map.container.fitToViewport();
  setTimeout(() => {
    map.setBounds(bounds, { checkZoomRange:true, zoomMargin:40 }).then(() => {
      if(map.getZoom() < 3 || map.getZoom() > 11) map.setZoom(map.getZoom() > 11 ? 11 : 6);
    });
  }, 0);

  }); // ymaps.ready
</script>
